name: Test, build and publish Student API
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - name: Build and run two API instances with Nginx
        run: docker compose up -d --build --wait
      - name: Test all application routes on one instance
        run: BASE_URL=http://127.0.0.1:8001 python automationTesting.py
      - name: Check load-balanced responses
        run: |
          python - <<'PY'
          import json, urllib.request
          for _ in range(20):
              with urllib.request.urlopen('http://localhost:8080/students', timeout=5) as response:
                  assert len(json.load(response)) == 3
          PY
          docker compose logs nginx
          test "$(docker compose logs nginx | sed -n 's/.*upstream=\([^ ]*\).*/\1/p' | sort -u | wc -l)" -ge 2
      - name: Container logs and cleanup
        if: always()
        run: |
          docker compose logs
          docker compose down
  publish:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Docker Hub secrets
        env:
          DOCKERUSERNAME: ${{ secrets.DOCKERUSERNAME }}
          DOCKERTOKEN: ${{ secrets.DOCKERTOKEN }}
        run: |
          python - <<'PY'
          import os, re
          username = os.environ["DOCKERUSERNAME"].strip()
          if not re.fullmatch(r"[a-z0-9][a-z0-9_-]*", username):
              raise SystemExit("DOCKERUSERNAME must contain only your lowercase Docker Hub username.")
          if not os.environ["DOCKERTOKEN"].strip():
              raise SystemExit("DOCKERTOKEN is missing.")
          with open(os.environ["GITHUB_ENV"], "a") as env_file:
              env_file.write(f"DOCKERHUB_USER={username}\n")
          PY
      - uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERTOKEN }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.DOCKERHUB_USER }}/fastapi-app:v0.1
            ${{ env.DOCKERHUB_USER }}/fastapi-app:${{ github.sha }}
      - name: Pull and check the published image
        env:
          IMAGE: ${{ env.DOCKERHUB_USER }}/fastapi-app:${{ github.sha }}
        run: |
          docker pull "$IMAGE"
          docker run -d --name published-api -p 127.0.0.1:8000:8000 "$IMAGE"
          python - <<'PY'
          import json, time, urllib.request
          for attempt in range(30):
              try:
                  with urllib.request.urlopen("http://localhost:8000/health", timeout=2) as response:
                      assert json.load(response) == {"status": "healthy"}
                  break
              except Exception:
                  if attempt == 29:
                      raise
                  time.sleep(1)
          with urllib.request.urlopen("http://localhost:8000/") as response:
              data = json.load(response)
              assert data["sap_id"] == "590015169"
              assert data["location"] == "Dehradun"
          with urllib.request.urlopen("http://localhost:8000/students") as response:
              assert len(json.load(response)) == 3
          PY
          python automationTesting.py
      - name: Published container logs and cleanup
        if: always()
        run: |
          docker logs published-api || true
          docker rm -f published-api || true
