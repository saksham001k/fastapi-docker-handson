name: Test, build and publish Student API
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - name: Build and run two API instances with Nginx
        run: docker compose up -d --build --wait
      - name: Check load-balanced responses
        run: |
          python - <<'PY'
          import json, urllib.request
          for _ in range(20):
              with urllib.request.urlopen('http://localhost:8080/students', timeout=5) as response:
                  assert len(json.load(response)) == 2
          PY
          docker compose logs nginx
          test "$(docker compose logs nginx | sed -n 's/.*upstream=\([^ ]*\).*/\1/p' | sort -u | wc -l)" -ge 2
      - name: Container logs and cleanup
        if: always()
        run: |
          docker compose logs
          docker compose down
  publish:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Docker Hub secrets
        env:
          DOCKERUSERNAME: ${{ secrets.DOCKERUSERNAME }}
          DOCKERTOKEN: ${{ secrets.DOCKERTOKEN }}
        run: |
          test -n "$DOCKERUSERNAME" && test -n "$DOCKERTOKEN" || { echo 'Add DOCKERUSERNAME and DOCKERTOKEN in repository Actions secrets.'; exit 1; }
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERUSERNAME }}
          password: ${{ secrets.DOCKERTOKEN }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERUSERNAME }}/fastapi-app:v0.1
            ${{ secrets.DOCKERUSERNAME }}/fastapi-app:${{ github.sha }}
