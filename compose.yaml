services:
  fastapi-1:
    build: .
    image: ${DOCKERUSERNAME:-local}/fastapi-app:${IMAGE_TAG:-v0.1}
    ports:
      - "127.0.0.1:8001:8000"
  fastapi-2:
    build: .
    image: ${DOCKERUSERNAME:-local}/fastapi-app:${IMAGE_TAG:-v0.1}
    ports:
      - "127.0.0.1:8002:8000"
  nginx:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      fastapi-1:
        condition: service_healthy
      fastapi-2:
        condition: service_healthy
