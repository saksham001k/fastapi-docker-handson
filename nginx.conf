events {}
http {
    log_format backend '$request status=$status upstream=$upstream_addr time=$request_time';
    access_log /dev/stdout backend;
    upstream student_api {
        server fastapi-1:8000;
        server fastapi-2:8000;
    }
    server {
        listen 8080;
        location / {
            proxy_pass http://student_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
